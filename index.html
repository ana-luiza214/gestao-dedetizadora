<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema Dedetizadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login do Sistema</h2>

  <input id="user" placeholder="Usuário">
  <input id="pass" type="password" placeholder="Senha">

  <button onclick="login()">Entrar</button>
</div>

<!-- SISTEMA -->
<div id="app" style="display:none;">

  <h1>Gestão Dedetizadora</h1>

  <button onclick="logout()">Sair</button>

  <div class="container">

    <h2>Dashboard</h2>
    <p id="dashboard"></p>

    <hr>

    <!-- CLIENTES -->
    <h2>Clientes</h2>

    <input id="busca" placeholder="Buscar cliente..." onkeyup="buscarCliente()">

    <input id="nome" placeholder="Nome">
    <input id="telefone" placeholder="Telefone">
    <input id="endereco" placeholder="Endereço">

    <button onclick="adicionarCliente()">Salvar Cliente</button>

    <ul id="listaClientes"></ul>

    <hr>

    <!-- OS -->
    <h2>Ordens de Serviço</h2>

    <input id="clienteOS" placeholder="Cliente">
    <input id="servicoOS" placeholder="Serviço">
    <input id="dataOS" type="date">

    <button onclick="criarOS()">Criar OS</button>

    <ul id="listaOS"></ul>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
