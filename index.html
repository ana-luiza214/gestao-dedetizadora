<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema Dedetizadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Gestão Dedetizadora</h1>

  <div class="container">

    <!-- CLIENTES -->
    <h2>Clientes</h2>

    <input id="busca" placeholder="Buscar cliente..." onkeyup="buscarCliente()">

    <input id="nome" placeholder="Nome">
    <input id="telefone" placeholder="Telefone">
    <input id="endereco" placeholder="Endereço">

    <button onclick="adicionarCliente()">Salvar Cliente</button>

    <ul id="listaClientes"></ul>

    <hr>

    <!-- SERVIÇOS -->
    <h2>Agenda de Serviços</h2>

    <input id="data" type="date">
    <input id="clienteServico" placeholder="Cliente">
    <input id="tipoServico" placeholder="Tipo de serviço">
    <input id="valorServico" placeholder="Valor do serviço">

    <button onclick="adicionarServico()">Agendar Serviço</button>

    <ul id="listaServicos"></ul>

    <hr>

    <!-- OS -->
    <h2>Ordens de Serviço (OS)</h2>

    <input id="clienteOS" placeholder="Cliente">
    <input id="servicoOS" placeholder="Serviço">
    <input id="dataOS" type="date">

    <button onclick="criarOS()">Criar OS</button>

    <ul id="listaOS"></ul>

    <hr>

    <!-- FINANCEIRO -->
    <h2>Financeiro</h2>

    <h3>Resumo</h3>
    <p id="resumoFinanceiro"></p>

    <h3>Contas a Pagar</h3>
    <input id="descricaoPagar" placeholder="Descrição">
    <input id="valorPagar" placeholder="Valor">
    <button onclick="addPagar()">Adicionar</button>

    <ul id="listaPagar"></ul>

    <h3>Contas a Receber</h3>
    <input id="descricaoReceber" placeholder="Descrição">
    <input id="valorReceber" placeholder="Valor">
    <button onclick="addReceber()">Adicionar</button>

    <ul id="listaReceber"></ul>

  </div>

  <script src="app.js"></script>
</body>
</html>
