<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dedetizadora Confiança</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <img src="logo.png" class="logo">
  <h1>Dedetizadora Confiança</h1>
</div>

<div class="container">

  <h2>Clientes</h2>

  <input id="nome" placeholder="Nome">
  <input id="telefone" placeholder="Telefone">

  <button onclick="addCliente()">Salvar Cliente</button>

  <ul id="listaClientes"></ul>

  <hr>

  <h2>Serviços (Agenda)</h2>

  <input id="clienteServico" placeholder="Cliente">
  <input id="dataServico" type="date">
  <input id="retornoDias" type="number" placeholder="Dias para retorno">

  <button onclick="addServico()">Salvar Serviço</button>

  <ul id="listaServicos"></ul>

  <hr>

  <h2>Ordens de Serviço</h2>

  <input id="clienteOS" placeholder="Cliente">
  <input id="servicoOS" placeholder="Serviço">

  <button onclick="addOS()">Criar OS</button>

  <ul id="listaOS"></ul>

  <hr>

  <h2>Financeiro</h2>

  <input id="descricao" placeholder="Descrição">
  <input id="valor" type="number" placeholder="Valor">

  <button onclick="addFinanceiro()">Adicionar</button>

  <p id="resumo"></p>

</div>

<script src="app.js"></script>
</body>
</html>
