<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema Dedetizadora Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>
  <input id="user" placeholder="Usuário">
  <input id="pass" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- SISTEMA -->
<div id="app" style="display:none;">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Dedetizadora</h2>
    <button onclick="mostrarSecao('clientes')">Clientes</button>
    <button onclick="mostrarSecao('servicos')">Serviços</button>
    <button onclick="mostrarSecao('os')">OS</button>
    <button onclick="logout()">Sair</button>
  </div>

  <!-- CONTEUDO -->
  <div class="content">

    <h1>Dashboard</h1>
    <div class="card" id="dashboard"></div>

    <!-- CLIENTES -->
    <div id="clientes" class="card">
      <h2>Clientes</h2>

      <input id="nome" placeholder="Nome">
      <input id="telefone" placeholder="Telefone">

      <button onclick="adicionarCliente()">Salvar</button>

      <ul id="listaClientes"></ul>
    </div>

    <!-- SERVIÇOS -->
    <div id="servicos" class="card" style="display:none;">
      <h2>Serviços</h2>

      <input id="clienteServico" placeholder="Cliente">
      <input id="tipoServico" placeholder="Serviço">

      <button onclick="adicionarServico()">Agendar</button>

      <ul id="listaServicos"></ul>
    </div>

    <!-- OS -->
    <div id="os" class="card" style="display:none;">
      <h2>Ordens de Serviço</h2>

      <input id="clienteOS" placeholder="Cliente">
      <input id="servicoOS" placeholder="Serviço">

      <button onclick="criarOS()">Criar OS</button>

      <ul id="listaOS"></ul>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
